[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-ez"
version = "0.1.0"
description = "Generador interactivo y rápido de mensajes para commits en Git."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
git-ez = "git_ez:app"